name: C# release (GitHub Releases)

# Публикует готовую WPF-сборку и запускающий EXE как вложения GitHub Release.
# Именно эти вложения скачивает лаунчер с рабочего стола (см. tools/launcher/README.md).
on:
  push:
    branches:
      - main
    paths:
      - RELEASE_VERSION
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.1.0"
        required: true
        type: string

concurrency:
  group: csharp-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard SQL schema before release
        shell: pwsh
        run: |
          $schemaVersion = & ./tools/sql-migrations/Test-ReleaseSchema.ps1 -RepositoryRoot $PWD.Path
          "SQL_SCHEMA_VERSION=$schemaVersion" >> $env:GITHUB_ENV

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            if ($env:GITHUB_REF_TYPE -eq 'branch') {
              $tag = (Get-Content -LiteralPath 'RELEASE_VERSION' -Raw).Trim()
            } else {
              $tag = $env:GITHUB_REF_NAME
            }
          }
          $tag = $tag.Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.\-]+)?$') {
            throw "Тег релиза должен выглядеть как v1.2.3 (получено: '$tag')."
          }
          $version = ($tag -replace '^v', '') -replace '-.*$', ''
          "TAG=$tag" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Релиз $tag, версия сборки $version"

      - name: Restore
        run: dotnet restore GmcSmeta.slnx

      - name: Build solution
        run: dotnet build GmcSmeta.slnx --configuration Release --no-restore --nologo

      # Пять тестов сверяют живой Python-эталон через локальный db/base.db.
      # Этот файл намеренно не хранится в git (данные, а не исходники), поэтому в CI
      # они не могут пройти ни на одной ревизии. Остальные офлайн-тесты — обязательны.
      - name: Offline unit tests (without local base.db parity fixtures)
        shell: pwsh
        run: |
          $filter = @(
            'FullyQualifiedName!~NavigationParityTests.AllThreeTrees_MatchActualPythonWidgets'
            'FullyQualifiedName!~ActsTests.ActBrowser_MatchesActualPythonRowsSourcesAndFilteredFooter'
            'FullyQualifiedName!~EstimateDisplayTests.DisplayStatistics_MatchPythonOnAll34Documents'
            'FullyQualifiedName!~WorkspaceTests.ObjectCardsAndTotals_MatchActualPythonPage'
            'FullyQualifiedName!~FinanceTests.Finance_MatchesPythonForEveryDocument'
          ) -join '&'
          dotnet test tests/GmcSmeta.Core.Tests/GmcSmeta.Core.Tests.csproj `
            --configuration Release --no-build --nologo --filter $filter

      - name: Publish self-contained application
        shell: pwsh
        run: |
          dotnet publish src/GmcSmeta.App/GmcSmeta.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:Version=$env:VERSION -p:DebugType=None -p:DebugSymbols=false `
            --output artifacts/app-sc --nologo

      - name: Publish framework-dependent application
        shell: pwsh
        run: |
          dotnet publish src/GmcSmeta.App/GmcSmeta.App.csproj `
            --configuration Release --runtime win-x64 --self-contained false `
            -p:Version=$env:VERSION -p:DebugType=None -p:DebugSymbols=false `
            --output artifacts/app-fx --nologo

      - name: Publish launcher (single self-contained EXE)
        shell: pwsh
        run: |
          dotnet publish tools/launcher/GmcSmeta.Launcher/GmcSmeta.Launcher.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$env:VERSION -p:DebugType=None -p:DebugSymbols=false `
            --output artifacts/launcher --nologo

      - name: Pack archives and checksums
        shell: pwsh
        run: |
          $out = 'artifacts/release'
          New-Item -ItemType Directory -Path $out -Force | Out-Null

          $exe = 'artifacts/launcher/GmcSmeta.Launcher.exe'
          if (-not (Test-Path $exe)) { throw "Лаунчер не собран: $exe" }
          foreach ($app in 'artifacts/app-sc', 'artifacts/app-fx') {
            if (-not (Test-Path (Join-Path $app 'GMC-Smeta-Next.exe'))) {
              throw "Приложение не собрано: $app"
            }
          }

          Compress-Archive -Path (Join-Path 'artifacts/app-sc' '*') `
            -DestinationPath (Join-Path $out 'GMC-Smeta-Next-win-x64.zip') -CompressionLevel Optimal
          Compress-Archive -Path (Join-Path 'artifacts/app-fx' '*') `
            -DestinationPath (Join-Path $out 'GMC-Smeta-Next-win-x64-fx.zip') -CompressionLevel Optimal
          Copy-Item $exe (Join-Path $out 'GmcSmeta.Launcher.exe')
          Set-Content -Path (Join-Path $out 'version.txt') -Value $env:TAG -Encoding utf8
          Set-Content -Path (Join-Path $out 'sql-schema-version.txt') -Value $env:SQL_SCHEMA_VERSION -Encoding utf8

          $sums = Get-ChildItem $out -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Value $sums -Encoding utf8
          Get-ChildItem $out -File | Select-Object Name, @{n='МБ';e={[math]::Round($_.Length/1MB,1)}}

      - name: Upload build artifacts (diagnostics)
        uses: actions/upload-artifact@v4
        with:
          name: csharp-release-${{ env.VERSION }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem 'artifacts/release' -File | ForEach-Object { $_.FullName })
          gh release view $env:TAG --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_TYPE -eq 'branch') {
              throw "Релиз $env:TAG уже существует. Для нового выпуска увеличьте RELEASE_VERSION."
            }
            Write-Host "Релиз $env:TAG уже существует — заменяю вложения."
            gh release upload $env:TAG @files --clobber
            gh release edit $env:TAG --title "ГМЦ-Смета C# $env:TAG" --latest
          } elseif ($env:GITHUB_REF_TYPE -eq 'branch' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            gh release create $env:TAG @files `
              --target "$env:GITHUB_SHA" `
              --title "ГМЦ-Смета C# $env:TAG" `
              --generate-notes `
              --latest
          } else {
            gh release create $env:TAG @files `
              --title "ГМЦ-Смета C# $env:TAG" `
              --generate-notes `
              --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Не удалось опубликовать релиз $env:TAG" }
          gh release view $env:TAG --json url,assets
